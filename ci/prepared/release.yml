name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Do not interrupt a publication. Rerun failed jobs, not all jobs, for recovery.
concurrency:
  group: spf-release-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install_args: go
          cache: false
      - name: Offline release script regression tests
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - run: |
          mise run check
          mise run race
          mise run build

  release-please:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact release commit and unfinished draft
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install_args: go
          cache: false
      - name: Revalidate the tagged source
        run: |
          mise run check
          mise run race
          mise run build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse to overwrite an existing versioned image
        env:
          # Empty by default; exact tag approved manually for a NEW package only.
          SPF_GHCR_BOOTSTRAP_TAG: ${{ vars.SPF_GHCR_BOOTSTRAP_TAG }}
        run: python3 .github/scripts/ensure-new-image-tag.py
      - name: Publish artifacts to draft and multiarch image to GHCR
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Read back draft assets and registry index
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > dist/github-release.json
          docker buildx imagetools inspect             "ghcr.io/quentinbtd/spotify-playlist-filler:${RELEASE_TAG}" --raw > dist/image-index.json
          python3 .github/scripts/verify-release.py             --release-json dist/github-release.json --image-index dist/image-index.json             --tag "$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --pattern '*.tar.gz' --pattern '*.zip' \
            --pattern checksums.txt --dir dist/readback
          cmp dist/checksums.txt dist/readback/checksums.txt
          cp dist/metadata.json dist/readback/metadata.json
          python3 .github/scripts/verify-release.py --dist dist/readback
      - name: Native smoke test of the published image
        run: |
          image="ghcr.io/quentinbtd/spotify-playlist-filler:${RELEASE_TAG}"
          docker pull --platform=linux/amd64 "$image"
          docker run --rm --platform=linux/amd64 --network=none --read-only             --cap-drop=ALL --security-opt=no-new-privileges "$image" --help
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Finalize only after verification and read it back
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
